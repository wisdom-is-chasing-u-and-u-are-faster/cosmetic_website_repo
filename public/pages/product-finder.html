<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Finder Quiz - AURA</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">AURA SKINCARE</a>
        <nav aria-label="Main Navigation">
            <ul class="nav-links">
                <li><a href="/pages/home.html">Home</a></li>
                <li><a href="/pages/product-finder.html" style="color: var(--color-primary); font-weight: 700;">Skin Finder</a></li>
                <li><a href="/pages/product-listing.html">Catalog</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="quiz-section">
            <h1 style="margin-bottom: 0.5rem;">Find Your Personalized Skincare Regimen</h1>
            <p style="color: var(--color-text-muted); margin-bottom: 2rem;">Select your skin type and concerns to generate a custom 4-step routine in under 250ms.</p>

            <form id="finder-form">
                <fieldset style="border: none;">
                    <legend style="font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem;">1. Select Your Skin Type</legend>
                    <div id="skin-type-options" class="skin-grid" role="radiogroup" aria-label="Skin Types">
                        <!-- Loaded dynamically from /api/v1/skin-profiles/options -->
                    </div>
                </fieldset>

                <fieldset style="border: none; margin-top: 1.5rem;">
                    <legend style="font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem;">2. Select Your Primary Concerns</legend>
                    <div id="concerns-options" class="pills-container">
                        <!-- Loaded dynamically from /api/v1/skin-profiles/options -->
                    </div>
                </fieldset>

                <div style="margin-top: 2.5rem; text-align: center;">
                    <button id="finder-submit-btn" type="submit" class="btn-primary" style="font-size: 1.1rem; padding: 1rem 2.5rem;">
                        Analyze &amp; Generate My Custom Routine
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script src="/js/api.js"></script>
</body>
</html>
